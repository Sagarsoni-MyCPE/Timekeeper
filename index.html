<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Time Keeper</title>
  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #f4f6fb;
  color: #1a2340;
  font-family: 'Segoe UI', Arial, sans-serif;
  width: 100%;
  min-height: 200px;
  padding: 0 0 8px 0;
  font-size: 13px;
}

/* ── HEADER ── */
.header {
  background: linear-gradient(135deg, #1a2340 0%, #2d3a5e 100%);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-icon {
  background: #3b5bdb;
  color: #fff;
  width: 30px;
  height: 30px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: bold;
}

.brand-name {
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.brand-one {
  color: #74c0fc;
}

.brand-sub {
  color: #a5b4fc;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.header-clock {
  color: #74c0fc;
  font-size: 18px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: 1px;
}

/* ── STATUS BAR ── */
.status-bar {
  background: #eef2ff;
  border-bottom: 1px solid #c5cae9;
  padding: 5px 16px 6px;
  font-size: 11.5px;
  display: flex;
  align-items: center;
  gap: 6px;
  color: #3949ab;
  flex-wrap: wrap;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #bdbdbd;
  display: inline-block;
  flex-shrink: 0;
}

.status-dot.green  { background: #43a047; }
.status-dot.yellow { background: #fb8c00; }
.status-dot.red    { background: #e53935; }

.progress-track {
  flex: 1;
  height: 7px;
  background: #c5cae9;
  border-radius: 4px;
  overflow: hidden;
  min-width: 60px;
}

.progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 4px;
  background: linear-gradient(90deg, #1a237e, #3b5bdb);
  transition: width 0.5s ease, background 0.3s;
}

.progress-fill.done {
  background: linear-gradient(90deg, #1a237e, #3b5bdb);
}

.progress-fill.warn {
  background: linear-gradient(90deg, #1a237e, #3b5bdb);
}

#progressPct {
  font-size: 11px;
  font-weight: 700;
  color: #3949ab;
  white-space: nowrap;
  min-width: 30px;
  text-align: right;
}

/* ── GREETING IN HEADER ── */
.header-greeting {
  flex: 1;
  text-align: center;
  font-size: 11.5px;
  font-weight: 600;
  color: #a5b4fc;
  letter-spacing: 0.2px;
  padding: 0 8px;
  line-height: 1.3;
}

.header-greeting .name {
  color: #74c0fc;
}

/* ── SECTIONS ── */
.section {
  padding: 10px 14px 4px;
}

.section-label {
  font-size: 11px;
  font-weight: 600;
  color: #5c6bc0;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 5px;
}

.hint {
  font-size: 10px;
  color: #9fa8da;
  text-transform: none;
  font-weight: 400;
}

textarea {
  width: 100%;
  height: 80px;
  background: #fff;
  color: #1a2340;
  border: 1.5px solid #c5cae9;
  border-radius: 7px;
  padding: 8px 10px;
  font-size: 12px;
  font-family: 'Consolas', monospace;
  resize: vertical;
  transition: border 0.2s;
}

textarea:focus {
  outline: none;
  border-color: #3b5bdb;
}

/* ── TARGET ROW ── */
.target-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: #fff;
  border-top: 1px solid #e8eaf6;
  border-bottom: 1px solid #e8eaf6;
  margin: 6px 0;
}

.target-label {
  font-size: 11px;
  font-weight: 600;
  color: #3949ab;
  white-space: nowrap;
}

.time-input {
  border: 1.5px solid #c5cae9;
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 13px;
  color: #1a2340;
  background: #f8f9ff;
  cursor: pointer;
  width: 118px;
}

.time-input:focus {
  outline: none;
  border-color: #3b5bdb;
}

.ot-input {
  border: 1.5px solid #c5cae9;
  border-radius: 6px;
  padding: 4px 6px;
  font-size: 13px;
  color: #1a2340;
  background: #f8f9ff;
  width: 48px;
}

.ot-input:focus { outline: none; border-color: #3b5bdb; }

.ot-divider {
  flex: 1;
  height: 1px;
  background: #c5cae9;
  margin: 0 6px;
}

.btn-reset {
  background: none;
  border: none;
  color: #ef5350;
  cursor: pointer;
  font-size: 14px;
  padding: 2px 4px;
  border-radius: 4px;
}

.btn-reset:hover { background: #ffebee; }

/* ── DAY TYPE ROW ── */
.daytype-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  background: #f8f9ff;
  border-top: 1px solid #e8eaf6;
  border-bottom: 1px solid #e8eaf6;
  margin-bottom: 2px;
}

.daytype-label {
  font-size: 12px;
  font-weight: 600;
  color: #3949ab;
  white-space: nowrap;
}

.daytype-select {
  flex: 1;
  border: 1.5px solid #c5cae9;
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 12px;
  color: #1a2340;
  background: #fff;
  cursor: pointer;
  font-family: inherit;
}

.daytype-select:focus {
  outline: none;
  border-color: #3b5bdb;
}

/* ── CARDS ── */
.cards-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  padding: 8px 14px;
}

.card-placeholder {
  grid-column: 1 / -1;
  text-align: center;
  color: #9fa8da;
  padding: 20px;
  font-size: 12px;
}

.card {
  background: #fff;
  border-radius: 9px;
  padding: 11px 12px;
  border: 1.5px solid #e8eaf6;
  box-shadow: 0 1px 4px rgba(59,91,219,0.06);
  transition: box-shadow 0.2s, border-color 0.2s;
}

.card:hover {
  box-shadow: 0 3px 10px rgba(59,91,219,0.13);
  border-color: #9fa8da;
}

.card-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: #7986cb;
  margin-bottom: 5px;
}

.card-value {
  font-size: 16px;
  font-weight: 700;
  color: #1a2340;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}

.card-sub {
  font-size: 10px;
  color: #9fa8da;
  margin-top: 2px;
}

/* Card color themes */
.card.blue   { border-left: 3px solid #3b5bdb; }
.card.green  { border-left: 3px solid #43a047; }
.card.orange { border-left: 3px solid #fb8c00; }
.card.red    { border-left: 3px solid #e53935; }
.card.purple { border-left: 3px solid #8e24aa; }
.card.teal   { border-left: 3px solid #00897b; }

.card.blue   .card-value { color: #3b5bdb; }
.card.green  .card-value { color: #43a047; }
.card.orange .card-value { color: #fb8c00; }
.card.red    .card-value { color: #e53935; }
.card.purple .card-value { color: #8e24aa; }
.card.teal   .card-value { color: #00897b; }

/* Wide card (spans 3 cols) */
.card.wide {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}

.card.wide .card-part {
  flex: 1;
  min-width: 110px;
  border-right: 1px solid #e8eaf6;
  padding-right: 18px;
}

.card.wide .card-part:last-child {
  border-right: none;
}

/* "Done" highlight */
.card.done {
  background: #e8f5e9;
  border-color: #a5d6a7;
}

.card.overdue {
  background: #fff3e0;
  border-color: #ffcc80;
}

/* ── ACTIONS ── */
.actions-row {
  display: flex;
  gap: 8px;
  padding: 4px 14px 6px;
}

.btn-secondary {
  flex: 1;
  background: #eef2ff;
  color: #3b5bdb;
  border: 1.5px solid #c5cae9;
  border-radius: 7px;
  padding: 7px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}

.btn-secondary:hover { background: #dde3ff; }

.btn-danger {
  background: #fff;
  color: #e53935;
  border: 1.5px solid #ffcdd2;
  border-radius: 7px;
  padding: 7px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}

.btn-danger:hover { background: #ffebee; }

/* ── FOOTER ── */
.footer {
  text-align: center;
  font-size: 10.5px;
  color: #9fa8da;
  padding: 6px 0 2px;
  border-top: 1px solid #e8eaf6;
  margin-top: 2px;
}

.footer strong {
  color: #3949ab;
}

/* ── GO HOME ANIMATION OVERLAY ── */
#goHomeOverlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(10, 20, 50, 0.82);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: overlayFadeIn 0.5s ease;
}
@keyframes overlayFadeIn { from { opacity:0; } to { opacity:1; } }

#goHomeScene {
  background: linear-gradient(160deg, #1a2340 0%, #2d3a5e 100%);
  border-radius: 16px;
  padding: 18px 16px 14px;
  width: 320px;
  text-align: center;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  border: 1.5px solid #3b5bdb;
  position: relative;
}
#goHomeMsg {
  font-size: 18px; font-weight: 800; color: #ffd700;
  margin-bottom: 10px; letter-spacing: 0.5px;
}
#goHomeSVG { width: 100%; border-radius: 10px; overflow: hidden; }

#animCanvas { width: 100%; border-radius: 10px; display: block; }
#goHomeSub { font-size:12px; color:#a5b4fc; margin: 10px 0 12px; }

#dismissAnim {
  background: #3b5bdb; color: #fff; border: none;
  border-radius: 8px; padding: 8px 22px;
  font-size: 13px; font-weight: 600; cursor: pointer;
}
#dismissAnim:hover { background: #2f4ac0; }

  /* Mobile overrides */
  body { padding-bottom: 20px; }
  #goHomeScene { width: 92vw; max-width: 340px; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-brand">
      <div class="brand-icon">▶</div>
      <div>
        <div class="brand-name">MYCPE <span class="brand-one">ONE</span></div>
        <div class="brand-sub">Time Keeper</div>
      </div>
    </div>
    <div id="greetingText" class="header-greeting">Hey, Good morning!</div>
    <div class="header-clock" id="clock">00:00:00</div>
  </div>

  <!-- Status Bar + Progress -->
  <div class="status-bar" id="statusBar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Loading...</span>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span id="progressPct"></span>
  </div>

  <!-- Manual Log Input -->
  <div class="section">
    <div class="section-label">Attendance Punch Log <span class="hint">(paste from MYCPE Attendance View)</span></div>
    <textarea id="logs" placeholder="Paste punch logs here&#10;Format: Date  Time  IN/OUT&#10;Example: Jun 26,2026  11:57  IN"></textarea>
  </div>

  <!-- Target Logout + OT Hours row -->
  <div class="target-row">
    <div class="target-label">🎯 Target Logout</div>
    <input type="time" id="targetTime" class="time-input">
    <button class="btn-reset" id="clearTarget">✕</button>
    <div class="ot-divider"></div>
    <div class="target-label" style="text-align:right;">⏱ OT Hrs</div>
    <input type="number" id="otHours" class="ot-input" min="1" max="12" step="0.5" placeholder="0">
    <button class="btn-reset" id="clearOT">✕</button>
  </div>

  <!-- Day Type Selector -->
  <div class="daytype-row">
    <div class="daytype-label">📅 Day Type</div>
    <select id="dayType" class="daytype-select">
      <option value="FULL">Full Day (8h In / 9h Total)</option>
      <option value="HALF">Half Day (4h In / 4h 30m Total)</option>
      <option value="P75">0.75 Day + 0.25 Leave (6h In / 6h 45m Total)</option>
    </select>
  </div>

  <!-- Main Cards Grid -->
  <div class="cards-grid" id="cards">
    <div class="card-placeholder">Paste punch data above to see calculations</div>
  </div>

  <!-- Action Buttons -->
  <div class="actions-row">
    <button class="btn-secondary" id="refreshBtn">↻ Refresh</button>
    <button class="btn-danger" id="clearBtn">🗑 Clear All</button>
  </div>

  <!-- Footer -->
  <div class="footer">Prepared by <strong>Sagar Soni</strong> &nbsp;|&nbsp; Time Keeper v4.1</div>

<script>

// ── localStorage wrappers (replaces chrome.storage) ─────────────────────
function localGet(keys, cb) {
  const r = {};
  keys.forEach(k => { try { const v = localStorage.getItem(k); if (v !== null) r[k] = v; } catch(e){} });
  cb(r);
}
function localSet(obj) {
  Object.entries(obj).forEach(([k,v]) => { try { localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v)); } catch(e){} });
}
function localRemove(key) { try { localStorage.removeItem(key); } catch(e){} }
function storageOnChanged(cb) { /* no-op on mobile */ }

// ── Time Keeper – popup.js ──────────────────────────────────────────────────
// Prepared by Sagar Soni
// Policy:
//   Full Day   → 9h Total Office Time  + 8h In Time
//   0.75 Day   → 6h45m Total           + 6h In Time
//   Half Day   → 4h30m Total           + 4h In Time
//   Break      → Mandatory 1h included in 9h (so 8h in-seat + 1h break)
//   Midnight   → Punches after 00:00 belong to the SAME working day
// ─────────────────────────────────────────────────────────────────────────────

const MS = { h: 3600000, m: 60000, s: 1000 };
const POLICY = {
  FULL: { total: 9 * 3600000,              inTime: 8 * 3600000, minBreak: 3600000,          label: 'Full Day' },
  P75:  { total: 6 * 3600000 + 45 * 60000, inTime: 6 * 3600000, minBreak: 45 * 60000,       label: '0.75 Day + 0.25 Leave' },
  HALF: { total: 4 * 3600000 + 30 * 60000, inTime: 4 * 3600000, minBreak: 30 * 60000,       label: 'Half Day' },
};

// DOM refs
const logsEl    = document.getElementById('logs');
const greetingText = document.getElementById('greetingText');

// ── Greeting logic ────────────────────────────────────────────────────────
let mycpeName = '';

function updateGreeting() {
  if (!greetingText) return;
  const h = new Date().getHours();
  const salutation = h < 12 ? 'Good morning!' : h < 16 ? 'Good afternoon!' : 'Good evening!';
  const emoji = h < 12 ? '🌅' : h < 16 ? '☀️' : '🌙';
  const nameHtml = mycpeName ? ` <span class="name">${mycpeName}</span>,` : ',';
  greetingText.innerHTML = `${emoji} Hey${nameHtml} ${salutation}`;
}

// Load name from storage on open
localGet(['mycpeName'], r => {
  if (r.mycpeName) mycpeName = r.mycpeName;
  updateGreeting();
});

// Listen for name updates from content script
storageOnChanged((changes, area) => {
  if (area === 'local' && changes.mycpeName) {
    mycpeName = changes.mycpeName.newValue || '';
    updateGreeting();
  }
});

const targetEl  = document.getElementById('targetTime');
const cardsEl   = document.getElementById('cards');
const clockEl   = document.getElementById('clock');
const statusDot  = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const dayTypeEl  = document.getElementById('dayType');
const otHoursEl  = document.getElementById('otHours');

// ── Utilities ─────────────────────────────────────────────────────────────
function fmtDuration(ms, forceSign = false) {
  if (ms == null || isNaN(ms)) return '--';
  const neg = ms < 0;
  ms = Math.abs(ms);
  const h = Math.floor(ms / MS.h);
  const m = Math.floor((ms % MS.h) / MS.m);
  const s = Math.floor((ms % MS.m) / MS.s);
  const str = `${h}:${pad(m)}:${pad(s)}`;
  if (neg) return `−${str}`;
  if (forceSign && !neg) return `+${str}`;
  return str;
}

function fmtTime(date) {
  if (!date || isNaN(date)) return '--';
  return date.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
}

function pad(n) { return String(n).padStart(2, '0'); }

const progressFill = document.getElementById('progressFill');
const progressPct  = document.getElementById('progressPct');

function setStatus(text, type) {
  statusText.textContent = text;
  statusDot.className = 'status-dot ' + (type || '');
}

function setProgress(pct, type) {
  if (!progressFill || !progressPct) return;
  const clamped = Math.min(100, Math.max(0, pct));
  progressFill.style.width = clamped + '%';
  progressFill.className = 'progress-fill' + (type === 'green' ? ' done' : type === 'yellow' ? ' warn' : '');
  progressPct.textContent = clamped === 100 ? '✓' : clamped + '%';
  progressPct.style.color = type === 'green' ? '#43a047' : type === 'yellow' ? '#fb8c00' : '#3949ab';
}

// ── Get current policy based on dropdown ─────────────────────────────────
function getCurrentPolicy() {
  const key = dayTypeEl ? dayTypeEl.value : 'FULL';
  return POLICY[key] || POLICY.FULL;
}

// ── Parse punch log (handles midnight crossing) ───────────────────────────
// Each line: "Jun 26,2026  11:57  IN"  or  "Jun 26,2026\t11:57\tIN"
function parsePunches(text) {
  const punches = [];
  const lines = text.trim().split(/\n+/);

  for (const line of lines) {
    if (!line.trim()) continue;
    const parts = line.trim().split(/[\t]+/);
    if (parts.length < 3) continue;

    const dateStr = parts[0].trim();
    const timeStr = parts[1].trim();
    const io      = parts[2].trim().toUpperCase();

    if (!dateStr || !timeStr || !io) continue;
    if (io !== 'IN' && io !== 'OUT') continue;

    // Parse time (HH:MM or H:MM or H:MM AM/PM)
    const timeClean = timeStr.replace(/\s?(AM|PM)/i, '').trim();
    const [hStr, mStr, sStr] = timeClean.split(':');
    let h = parseInt(hStr, 10);
    const m = parseInt(mStr || '0', 10);
    const s = parseInt(sStr || '0', 10);
    // Handle AM/PM
    if (/PM/i.test(timeStr) && h < 12) h += 12;
    if (/AM/i.test(timeStr) && h === 12) h = 0;
    if (isNaN(h) || isNaN(m)) continue;

    punches.push({ dateStr, h, m, s, io, raw: line });
  }

  return punches;
}

// Convert raw punches to absolute timestamps, handling midnight crossing.
function buildTimeline(punches) {
  if (!punches.length) return [];

  const timeline = [];

  for (const p of punches) {
    let dt = parseCalendarDate(p.dateStr);
    if (!dt) continue;
    dt.setHours(p.h, p.m, p.s || 0, 0);

    if (timeline.length === 0) {
      timeline.push({ ts: new Date(dt), io: p.io });
    } else {
      let candidate = new Date(dt);
      let delta = candidate - timeline[timeline.length - 1].ts;
      if (delta < 0) {
        // Crossed midnight
        candidate = new Date(candidate.getTime() + 24 * MS.h);
        delta = candidate - timeline[timeline.length - 1].ts;
      }
      timeline.push({ ts: candidate, io: p.io });
    }
  }

  return timeline;
}

// Try to parse "Jun 26,2026" or "Jun 26, 2026" or "2026-06-26"
function parseCalendarDate(str) {
  if (!str) return null;
  const d = new Date(str.replace(',', ' '));
  if (!isNaN(d)) return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return null;
}

// ── Core calculation ───────────────────────────────────────────────────────
function calculate() {
  const raw = logsEl.value.trim();
  if (!raw) {
    cardsEl.innerHTML = `<div class='card-placeholder'>Enter punch data to see calculations</div>`;
    return;
  }

  const punches = parsePunches(raw);
  if (!punches.length) {
    cardsEl.innerHTML = `<div class='card-placeholder'>Could not parse punch data. Check format.</div>`;
    return;
  }

  const timeline = buildTimeline(punches);
  if (!timeline.length) {
    cardsEl.innerHTML = `<div class='card-placeholder'>No valid punches found.</div>`;
    return;
  }

  const policy     = getCurrentPolicy();

  // ── OT Hours — minimum 1h enforced, ignored if less ──
  const otRaw     = parseFloat(otHoursEl ? otHoursEl.value : 0) || 0;
  const otVal     = otRaw >= 1 ? otRaw : 0;
  const otMs      = otVal * MS.h;
  const hasOT     = otVal >= 1;

  // effectiveInTime = policy inTime + OT
  const effectiveInTime   = policy.inTime + otMs;
  // No mandatory break when OT is entered
  const effectiveMinBreak = hasOT ? 0 : policy.minBreak;

  const now       = new Date();
  const loginTime = timeline[0].ts;

  // Compute in-time and break-time by scanning pairs
  let inTimeMs = 0;
  let breakMs  = 0;

  for (let i = 1; i < timeline.length; i++) {
    const prev = timeline[i - 1];
    const cur  = timeline[i];
    const diff = cur.ts - prev.ts;

    if (prev.io === 'IN' && cur.io === 'OUT') {
      inTimeMs += diff;
    } else if (prev.io === 'OUT' && cur.io === 'IN') {
      breakMs += diff;
    }
  }

  // Last entry – if IN, accumulate until NOW
  const lastEntry = timeline[timeline.length - 1];
  const currentlyOnBreak = lastEntry.io === 'OUT';
  const liveBreakMs = currentlyOnBreak ? (now - lastEntry.ts) : 0;
  if (lastEntry.io === 'IN') {
    inTimeMs += now - lastEntry.ts;
  }

  const totalBreakMs  = breakMs + liveBreakMs;
  const totalOfficeMs = now - loginTime;

  // ── Go Home Time ──
  // With OT: login + effectiveInTime + breaks taken (no fixed 9h)
  // Without OT: login + policy.total + extra break beyond minBreak
  let goHomeTime;
  if (hasOT) {
    goHomeTime = new Date(loginTime.getTime() + effectiveInTime + totalBreakMs);
  } else {
    const extraBreakNonOT = Math.max(0, breakMs - policy.minBreak);
    goHomeTime = new Date(loginTime.getTime() + policy.total + extraBreakNonOT);
  }
  // ── Target logout override ──
  let targetLogoutTs = null;
  if (targetEl.value) {
    const [th, tm] = targetEl.value.split(':').map(Number);
    targetLogoutTs = new Date(loginTime);
    targetLogoutTs.setHours(th, tm, 0, 0);
    if (targetLogoutTs < loginTime) targetLogoutTs = new Date(targetLogoutTs.getTime() + 24 * MS.h);
  }

  // Final go home (target overrides computed go home)
  const finalGoHome = targetLogoutTs || goHomeTime;

  // ── Validate target not before minimum ──
  if (targetLogoutTs && targetLogoutTs < goHomeTime) {
    cardsEl.innerHTML = `
      <div class="card red full" style="grid-column:1/-1;padding:18px;">
        <div class="card-label">⚠️ Invalid Target Logout Time</div>
        <div class="card-value" style="font-size:14px;margin:8px 0;">Target logout is too early${hasOT ? ' for ' + otVal + 'h OT day' : ' for a ' + policy.label}.</div>
        <div class="card-sub" style="font-size:12px;line-height:1.7;">
          Minimum logout based on your login (<strong>${fmtTime(loginTime)}</strong>) is:<br>
          <span style="font-size:16px;font-weight:700;color:#e53935;">${fmtTime(goHomeTime)}</span><br>
          Please set Target Logout to <strong>${fmtTime(goHomeTime)}</strong> or later.
        </div>
      </div>`;
    setStatus(`Target too early — min logout is ${fmtTime(goHomeTime)}`, 'red');
    setProgress(0, 'red');
    return;
  }

  // ── Available & remaining break ──
  let availableBreakMs, remainingBreakMs;
  if (hasOT && targetLogoutTs) {
    // OT + Target set: Available Break = Target Logout − Login − effectiveInTime
    availableBreakMs = Math.max(0, targetLogoutTs - loginTime - effectiveInTime);
    remainingBreakMs = availableBreakMs - totalBreakMs;
  } else if (hasOT) {
    // OT, no target: breaks taken are what's available (they push go home later)
    availableBreakMs = totalBreakMs;
    remainingBreakMs = 0;
  } else {
    const windowMs   = finalGoHome - loginTime;
    availableBreakMs = Math.max(policy.minBreak, windowMs - effectiveInTime);
    remainingBreakMs = availableBreakMs - totalBreakMs;
  }

  // ── Break overflow check (when target set and break exceeded) ──
  if (targetLogoutTs && remainingBreakMs < 0) {
    const newRequiredLogout = new Date(loginTime.getTime() + effectiveInTime + totalBreakMs);
    cardsEl.innerHTML = `
      <div class="card red full" style="grid-column:1/-1;padding:18px;">
        <div class="card-label">⚠️ Target Logout Needs to Change</div>
        <div class="card-value" style="font-size:14px;margin:8px 0;">Break taken exceeds available break for your target logout time.</div>
        <div class="card-sub" style="font-size:12px;line-height:1.9;">
          Break taken: <strong>${fmtDuration(totalBreakMs)}</strong><br>
          Available at target: <strong>${fmtDuration(availableBreakMs)}</strong><br>
          Exceeded by: <strong style="color:#e53935;">${fmtDuration(-remainingBreakMs)}</strong><br><br>
          New minimum logout:<br>
          <span style="font-size:18px;font-weight:700;color:#e53935;">${fmtTime(newRequiredLogout)}</span>
        </div>
      </div>`;
    setStatus(`Break exceeded — update target logout to ${fmtTime(newRequiredLogout)}`, 'red');
    setProgress(0, 'red');
    return;
  }

  // ── Remaining times ──
  const remainInMs    = Math.max(0, effectiveInTime - inTimeMs);
  const remainTotalMs = Math.max(0, finalGoHome - now);
  const extraBreak    = hasOT ? 0 : Math.max(0, breakMs - policy.minBreak);

  // ── Animation triggers ONLY when remainTotalMs hits 0 ──
  const isDone = remainTotalMs === 0;

  // ── Status bar ──
  if (isDone) {
    setStatus(`${policy.label}${hasOT ? ' +' + otVal + 'h OT' : ''} – You can go home! 🎉`, 'green');
    setProgress(100, 'green');
  } else {
    const pct = Math.min(100, Math.round((inTimeMs / effectiveInTime) * 100));
    setStatus(`${policy.label}${hasOT ? ' +' + otVal + 'h OT' : ''} – ${pct}% in-time completed`, 'yellow');
    setProgress(pct, 'yellow');
  }

  // ── Show/hide go-home animation ──
  const existingOverlay = document.getElementById('goHomeOverlay');
  if (isDone && !existingOverlay) {
    const overlay = document.createElement('div');
    overlay.id = 'goHomeOverlay';
    overlay.innerHTML = `
      <div id="goHomeScene">
        <div id="goHomeMsg">🌙 Time to Go Home!</div>
        <canvas id="animCanvas" width="320" height="180" style="border-radius:10px;display:block;"></canvas>
        <button id="dismissAnim">✕ Dismiss</button>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('dismissAnim').addEventListener('click', () => {
      overlay.remove();
      cancelAnimationFrame(animRAF);
      logsEl.value = '';
      localRemove('logs');
      cardsEl.innerHTML = `<div class='card-placeholder'>Enter punch data to see calculations</div>`;
      setStatus('Open MYCPE attendance page to auto-load', 'red');
    });

    const cv  = document.getElementById('animCanvas');
    const cx  = cv.getContext('2d');
    const CW  = cv.width, CH = cv.height;
    
    let animRAF, tick = 0;

    // ── Scene controller ─────────────────────────────────────
    // Scene 1: ~380 ticks   Scene 2: ~300 ticks   Scene 3: ~380 ticks
    const S1_END = 380, S2_END = 680, S3_END = 1060;

    // Shared helpers
    function rr(c,x,y,w,h,r){
      c.beginPath();
      c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
      c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
      c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
      c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y);
      c.closePath();
    }

    // ── SHARED: Night sky ─────────────────────────────────────
    function drawNightSky(horizon){
      const g=cx.createLinearGradient(0,0,0,horizon);
      g.addColorStop(0,'#030508'); g.addColorStop(1,'#0a1428');
      cx.fillStyle=g; cx.fillRect(0,0,CW,horizon);
      cx.fillStyle='#fffde7'; cx.beginPath(); cx.arc(CW-38,22,13,0,Math.PI*2); cx.fill();
      cx.fillStyle='#0a1428'; cx.beginPath(); cx.arc(CW-30,16,10,0,Math.PI*2); cx.fill();
      const stars=[[18,10],[45,6],[80,18],[115,5],[160,14],[195,7],[240,20],[270,10],[30,28],[130,26]];
      stars.forEach(([sx,sy])=>{
        const tw=0.5+0.5*Math.sin(tick*0.04+sx);
        cx.globalAlpha=0.5+0.5*tw; cx.fillStyle='#fff';
        cx.beginPath(); cx.arc(sx,sy,0.9,0,Math.PI*2); cx.fill();
      });
      cx.globalAlpha=1;
    }

    // ── SHARED: Draw Car ─────────────────────────────────────
    function drawCar(cx2,x,y,driver,moving){
      cx2.save(); cx2.translate(x,y);
      // Shadow
      cx2.fillStyle='rgba(0,0,0,0.25)'; cx2.beginPath(); cx2.ellipse(0,11,30,5,0,0,Math.PI*2); cx2.fill();
      // Body
      cx2.fillStyle='#1a56a0'; rr(cx2,-30,-8,60,16,5); cx2.fill();
      // Cabin
      cx2.fillStyle='#1e6abf'; rr(cx2,-20,-22,40,16,6); cx2.fill();
      // Windshields
      cx2.fillStyle='rgba(160,210,255,0.75)';
      cx2.beginPath(); cx2.moveTo(16,-22); cx2.lineTo(20,-8); cx2.lineTo(8,-8); cx2.lineTo(10,-22); cx2.closePath(); cx2.fill();
      cx2.beginPath(); cx2.moveTo(-16,-22); cx2.lineTo(-20,-8); cx2.lineTo(-10,-8); cx2.lineTo(-12,-22); cx2.closePath(); cx2.fill();
      // Side window
      cx2.fillStyle='rgba(160,210,255,0.6)'; rr(cx2,-8,-21,16,12,2); cx2.fill();
      // Door line
      cx2.strokeStyle='rgba(0,0,0,0.25)'; cx2.lineWidth=0.8;
      cx2.beginPath(); cx2.moveTo(0,-22); cx2.lineTo(0,-8); cx2.stroke();
      // Headlights
      cx2.fillStyle='#fffde7'; cx2.beginPath(); cx2.ellipse(29,-2,5,3,0,0,Math.PI*2); cx2.fill();
      if(moving){
        cx2.fillStyle='rgba(255,253,200,0.12)';
        cx2.beginPath(); cx2.moveTo(30,-5); cx2.lineTo(80,12); cx2.lineTo(80,-18); cx2.closePath(); cx2.fill();
      }
      // Tail lights
      cx2.fillStyle='#c62828'; cx2.beginPath(); cx2.ellipse(-29,-2,5,3,0,0,Math.PI*2); cx2.fill();
      if(moving){ cx2.fillStyle='rgba(198,40,40,0.25)'; cx2.beginPath(); cx2.ellipse(-29,-2,9,5,0,0,Math.PI*2); cx2.fill(); }
      // Wheels with spin
      const ang=moving?(tick*0.22):0;
      [[-19,8],[19,8]].forEach(([wx,wy])=>{
        cx2.fillStyle='#111'; cx2.beginPath(); cx2.arc(wx,wy,8,0,Math.PI*2); cx2.fill();
        cx2.fillStyle='#555'; cx2.beginPath(); cx2.arc(wx,wy,3.5,0,Math.PI*2); cx2.fill();
        cx2.strokeStyle='#444'; cx2.lineWidth=1.2;
        for(let a=0;a<4;a++){
          const ra=ang+a*Math.PI/2;
          cx2.beginPath(); cx2.moveTo(wx+Math.cos(ra)*7,wy+Math.sin(ra)*7); cx2.lineTo(wx-Math.cos(ra)*7,wy-Math.sin(ra)*7); cx2.stroke();
        }
      });
      // Exhaust
      if(moving && tick%10<5){
        cx2.fillStyle=`rgba(200,200,200,${0.15+Math.random()*0.1})`;
        cx2.beginPath(); cx2.arc(-34,-4,4+Math.random()*3,0,Math.PI*2); cx2.fill();
      }
      // Driver
      if(driver){
        cx2.fillStyle='#ffcc80'; cx2.beginPath(); cx2.arc(4,-17,4,0,Math.PI*2); cx2.fill();
        cx2.fillStyle='#4a3000'; cx2.beginPath(); cx2.arc(4,-20,3.5,Math.PI,Math.PI*2); cx2.fill();
      }
      cx2.restore();
    }

    // ── SHARED: Draw walking person ──────────────────────────
    function drawPerson(px,py,sc,legT,walking,briefcase){
      cx.save(); cx.translate(px,py); cx.scale(sc,sc);
      const lp=Math.sin(legT)*(walking?9:0);
      cx.strokeStyle='#1a56a0'; cx.lineWidth=4; cx.lineCap='round';
      cx.beginPath(); cx.moveTo(0,0); cx.lineTo(lp*0.55,16); cx.stroke();
      cx.beginPath(); cx.moveTo(0,0); cx.lineTo(-lp*0.55,16); cx.stroke();
      cx.fillStyle='#1a56a0'; rr(cx,-6,-20,13,20,3); cx.fill();
      cx.lineWidth=3;
      cx.beginPath(); cx.moveTo(0,-14); cx.lineTo(lp*0.4+7,-5); cx.stroke();
      cx.beginPath(); cx.moveTo(0,-14); cx.lineTo(-lp*0.4-7,-5); cx.stroke();
      if(briefcase){
        cx.fillStyle='#6d4c41'; cx.fillRect(9,-12,8,7);
        cx.strokeStyle='#4e342e'; cx.lineWidth=1;
        cx.beginPath(); cx.moveTo(11,-12); cx.lineTo(11,-10); cx.stroke();
      }
      cx.fillStyle='#ffcc80'; cx.beginPath(); cx.arc(0,-28,7,0,Math.PI*2); cx.fill();
      cx.fillStyle='#4a3000'; cx.beginPath(); cx.arc(0,-32,5.5,Math.PI,Math.PI*2); cx.fill();
      cx.fillStyle='#333';
      cx.beginPath(); cx.arc(-2.5,-27,1.2,0,Math.PI*2); cx.fill();
      cx.beginPath(); cx.arc(2.5,-27,1.2,0,Math.PI*2); cx.fill();
      // Smile (happy)
      cx.strokeStyle='#333'; cx.lineWidth=1;
      cx.beginPath(); cx.moveTo(-3,-23); cx.quadraticCurveTo(0,-20,3,-23); cx.stroke();
      cx.restore();
    }

    // ════════════════════════════════════════════════════════
    // SCENE 1: Elevator exit → walk to car → drive off right
    // ════════════════════════════════════════════════════════
    const GY1 = 138; // ground y scene 1
    let s1Phase='LIFT'; // LIFT → WALK → GETIN → DRIVE_OFF
    let s1Tick=0;
    let s1PersonX=42, s1LegT=0;
    let s1CarX=100;

    function drawOfficeBuilding(scrollX){
      const ox = scrollX; // buildings shift left as car drives off
      // Sky gradient already drawn
      // Ground
      cx.fillStyle='#080c08'; cx.fillRect(0,GY1,CW,CH-GY1);
      cx.fillStyle='#161616'; cx.fillRect(0,GY1+4,CW,18);
      cx.fillStyle='rgba(255,255,255,0.3)';
      for(let rx=0;rx<CW+60;rx+=50){ cx.fillRect((rx+scrollX*0.3)%CW,GY1+12,30,2); }
      // Pavement
      cx.fillStyle='#111'; cx.fillRect(0,GY1,CW,6);

      // Main tower
      const tx=ox;
      cx.fillStyle='#1a2870'; cx.fillRect(tx,20,80,GY1-20);
      // Glass curtain wall effect
      for(let gy=24;gy<GY1-4;gy+=14){
        for(let gx=tx+4;gx<tx+76;gx+=12){
          const lit=(gx+gy)%28<14;
          cx.fillStyle=lit?'#ffd54f':'#0d1a50';
          cx.fillRect(gx,gy,9,10);
        }
      }
      // Sign
      cx.fillStyle='#0a0f2a'; cx.fillRect(tx,12,80,10);
      cx.fillStyle='#74c0fc'; cx.font='bold 5px Arial'; cx.textAlign='center';
      cx.fillText('MYCPE ONE',tx+40,19);

      // Elevator shaft (glass)
      cx.fillStyle='rgba(10,20,80,0.9)'; cx.fillRect(tx+30,20,20,GY1-20);
      cx.strokeStyle='#3b5bdb'; cx.lineWidth=1; cx.strokeRect(tx+30,20,20,GY1-20);
      cx.fillStyle='#3b5bdb'; cx.font='3.5px Arial'; cx.textAlign='center';
      cx.fillText('LIFT',tx+40,28);
      // Shaft glow lines
      cx.strokeStyle='rgba(100,140,255,0.15)'; cx.lineWidth=0.5;
      for(let gl=30;gl<GY1-20;gl+=8){
        cx.beginPath(); cx.moveTo(tx+31,gl); cx.lineTo(tx+49,gl); cx.stroke();
      }

      // Elevator cabin
      const cabH=24;
      let cabY;
      if(s1Phase==='LIFT'){
        cabY=22+(GY1-22-cabH)*Math.min(s1Tick/100,1);
      } else {
        cabY=GY1-cabH;
      }
      cx.fillStyle='#2233a0'; cx.fillRect(tx+31,cabY,18,cabH);
      cx.strokeStyle='#5c7cfa'; cx.lineWidth=1; cx.strokeRect(tx+31,cabY,18,cabH);
      cx.strokeStyle='rgba(100,150,255,0.5)'; cx.lineWidth=0.8;
      cx.beginPath(); cx.moveTo(tx+40,cabY+2); cx.lineTo(tx+40,cabY+cabH-2); cx.stroke();
      // Cabin interior light
      cx.fillStyle='rgba(255,240,180,0.12)'; cx.fillRect(tx+32,cabY+1,16,cabH-2);
      // Person in lift — clipped to cabin so legs don't hang out
      if(s1Phase==='LIFT'){
        cx.save();
        cx.beginPath(); cx.rect(tx+31, cabY, 18, cabH); cx.clip();
        drawPerson(tx+40, cabY+cabH-1, 0.65, 0, false, true);
        cx.restore();
      }
      // Lobby door
      cx.fillStyle=s1Phase==='WALK'||s1Phase==='GETIN'||s1Phase==='DRIVE_OFF'?'#0a0820':'#ffd700';
      cx.fillRect(tx+31,GY1-22,18,22);
      if(s1Phase!=='WALK'&&s1Phase!=='GETIN'&&s1Phase!=='DRIVE_OFF'){
        cx.fillStyle='#c8a000'; cx.beginPath(); cx.arc(tx+47,GY1-11,1.5,0,Math.PI*2); cx.fill();
      }

      // Second building (bg)
      cx.fillStyle='#101d55';
      cx.fillRect(tx+85,45,50,GY1-45);
      for(let gy=48;gy<GY1-4;gy+=12){
        for(let gx=tx+88;gx<tx+132;gx+=10){
          cx.fillStyle=(gx*gy)%20<10?'#ffd54f':'#090f30';
          cx.fillRect(gx,gy,7,8);
        }
      }

      // Street lamp
      cx.fillStyle='#555'; cx.fillRect(tx+98,GY1-48,3,48);
      cx.fillStyle='#888'; cx.fillRect(tx+96,GY1-50,7,4);
      cx.fillStyle='rgba(255,240,150,0.6)';
      cx.beginPath(); cx.arc(tx+99,GY1-48,10,0,Math.PI*2); cx.fill();
      cx.fillStyle='#ffe066'; cx.beginPath(); cx.arc(tx+99,GY1-48,4,0,Math.PI*2); cx.fill();
    }

    function scene1(){
      
      const scrollX = s1Phase==='DRIVE_OFF'
        ? -(s1Tick*2.8)
        : 0;
      drawNightSky(GY1);
      drawOfficeBuilding(scrollX);
      const PHASE_DURS={LIFT:110,WALK:65,GETIN:45,DRIVE_OFF:160};

      if(s1Phase==='LIFT'){
        // Person visible inside cabin only
        if(s1Tick>=PHASE_DURS.LIFT){ s1Phase='WALK'; s1Tick=0; }

      } else if(s1Phase==='WALK'){
        s1PersonX = 50 + (s1CarX-32 - 50)*Math.min(s1Tick/PHASE_DURS.WALK,1);
        s1LegT+=0.22;
        drawPerson(s1PersonX, GY1-18, 1, s1LegT, true, true);
        drawCar(cx, s1CarX, GY1+10, false, false);
        if(s1Tick>=PHASE_DURS.WALK){ s1Phase='GETIN'; s1Tick=0; }

      } else if(s1Phase==='GETIN'){
        const sc=1-Math.min(s1Tick/PHASE_DURS.GETIN,1)*0.9;
        drawCar(cx, s1CarX, GY1+10, s1Tick>20, false);
        if(sc>0.15) drawPerson(s1CarX-22, GY1-18, sc, 0, false, true);
        if(s1Tick>=PHASE_DURS.GETIN){ s1Phase='DRIVE_OFF'; s1Tick=0; }

      } else if(s1Phase==='DRIVE_OFF'){
        const carSx = s1CarX + s1Tick*2.8;
        drawCar(cx, carSx, GY1+10, true, true);
        if(s1Tick>=PHASE_DURS.DRIVE_OFF){ s1Phase='LIFT'; s1Tick=0; s1PersonX=42; } // loop
      }
      s1Tick++;
    }

    // ════════════════════════════════════════════════════════
    // SCENE 2: Highway drive — scenery scrolls, car centred
    // ════════════════════════════════════════════════════════
    const GY2 = 130;
    let s2Scroll=0;
    // Tree positions (x offset in scroll space)
    const treeDefs=[20,80,160,240,310,390,460,540,620,700,760,840,920];
    // Hill positions
    const hillDefs=[0,200,450,700];

    function drawHighway(){
      // Sky
      drawNightSky(GY2);
      // Rolling hills (parallax slow)
      hillDefs.forEach(hx=>{
        const rx=(hx-s2Scroll*0.15)%900-100;
        cx.fillStyle='#050e05';
        cx.beginPath(); cx.moveTo(rx,GY2); cx.quadraticCurveTo(rx+100,GY2-38,rx+200,GY2); cx.closePath(); cx.fill();
      });
      // Ground
      cx.fillStyle='#060b06'; cx.fillRect(0,GY2,CW,CH-GY2);
      // Road
      const rg=cx.createLinearGradient(0,GY2+5,0,CH);
      rg.addColorStop(0,'#1a1a1a'); rg.addColorStop(1,'#0d0d0d');
      cx.fillStyle=rg; cx.fillRect(0,GY2+5,CW,CH-GY2-5);
      // Road edge lines
      cx.strokeStyle='rgba(255,255,100,0.7)'; cx.lineWidth=1.5;
      cx.beginPath(); cx.moveTo(0,GY2+6); cx.lineTo(CW,GY2+6); cx.stroke();
      cx.strokeStyle='rgba(255,255,255,0.6)'; cx.lineWidth=1;
      cx.beginPath(); cx.moveTo(0,CH-2); cx.lineTo(CW,CH-2); cx.stroke();
      // Centre dashes
      cx.strokeStyle='rgba(255,255,255,0.5)'; cx.lineWidth=2; cx.setLineDash([28,22]);
      cx.beginPath(); cx.moveTo(0,GY2+(CH-GY2)/2+2); cx.lineTo(CW,GY2+(CH-GY2)/2+2); cx.stroke();
      cx.setLineDash([]);
      // Roadside grass strip
      cx.fillStyle='#060c06'; cx.fillRect(0,GY2,CW,7);
      cx.fillStyle='#0a160a'; cx.fillRect(0,CH-8,CW,8);

      // Trees (both sides, scrolling fast)
      treeDefs.forEach(tx=>{
        const rx=((tx-s2Scroll*0.9)%960+960)%960-60;
        // Top side trees
        drawTree(rx, GY2-2, 0.9+Math.sin(tx)*0.15);
        // Bottom side trees (flipped, smaller)
        drawTree(rx+25, CH+2, -(0.7+Math.cos(tx)*0.1));
      });

      // Moon reflection on road
      cx.fillStyle='rgba(255,253,230,0.04)';
      cx.beginPath(); cx.ellipse(CW/2,GY2+20,15,4,0,0,Math.PI*2); cx.fill();

      // Street lamps (scrolling)
      [100,300,500,700,900].forEach(lx=>{
        const lrx=((lx-s2Scroll*0.85)%900+900)%900-50;
        cx.fillStyle='#444'; cx.fillRect(lrx,GY2-42,2,42);
        cx.fillStyle='rgba(255,240,150,0.5)'; cx.beginPath(); cx.arc(lrx+1,GY2-42,8,0,Math.PI*2); cx.fill();
        cx.fillStyle='#ffe066'; cx.beginPath(); cx.arc(lrx+1,GY2-42,3,0,Math.PI*2); cx.fill();
      });
    }

    function drawTree(tx,ty,sc){
      cx.save(); cx.translate(tx,ty); cx.scale(1,sc);
      cx.fillStyle='#1a0c00'; cx.fillRect(-2,0,4,sc>0?-22:22);
      cx.fillStyle='#051805';
      cx.beginPath(); cx.moveTo(0,sc>0?-38:-38*Math.abs(sc)); cx.lineTo(-11,sc>0?-18:-18*Math.abs(sc)); cx.lineTo(11,sc>0?-18:-18*Math.abs(sc)); cx.closePath(); cx.fill();
      cx.beginPath(); cx.moveTo(0,sc>0?-28:-28*Math.abs(sc)); cx.lineTo(-13,sc>0?-6:-6*Math.abs(sc)); cx.lineTo(13,sc>0?-6:-6*Math.abs(sc)); cx.closePath(); cx.fill();
      cx.restore();
    }

    function scene2(){
      // Player car is FIXED at centre — scenery scrolls left to simulate forward motion.
      // s2Scroll increases each frame = player's distance travelled.
      //
      // Other vehicles:
      //   - GREEN CAR being overtaken: moves RIGHT→LEFT very slowly
      //     (player is faster, so green car drifts backward across screen)
      //   - RED CAR trailing: moves RIGHT→LEFT at medium pace (behind player, falling back)
      //   - BLUE SCOOTER trailing: moves RIGHT→LEFT slightly faster (also behind, falling back)
      //   All use simple x = startX - speed*tick so motion is clear and readable.

      s2Scroll += 1.6;
      drawHighway();
      const bob = Math.sin(tick*0.15)*1.0;

      // ── GREEN CAR — being overtaken, drifts very slowly right→left ──
      // Starts off-screen right, crosses screen slowly, loops
      const greenX = (CW + 80 - (tick * 0.4) % (CW + 160));
      drawCar(cx, greenX, GY2 + 14 + Math.sin(tick*0.1+2)*0.5, false, false);
      // Green tint
      cx.save(); cx.globalCompositeOperation = 'multiply';
      cx.fillStyle = 'rgba(30,160,30,0.25)';
      cx.fillRect(greenX - 35, GY2 + 2, 70, 28);
      cx.restore();

      // ── RED CAR — trailing, drifts right→left at medium speed (behind player) ──
      const redX = (CW + 200 - (tick * 1.8) % (CW + 280));
      drawCar(cx, redX, GY2 + 16 + Math.sin(tick*0.13+1)*0.7, false, false);
      cx.save(); cx.globalCompositeOperation = 'multiply';
      cx.fillStyle = 'rgba(220,40,40,0.25)';
      cx.fillRect(redX - 35, GY2 + 4, 70, 26);
      cx.restore();

      // ── BLUE SCOOTER — trailing, slightly faster than red car ──
      const scootX = (CW + 350 - (tick * 1.1) % (CW + 400));
      cx.save(); cx.translate(scootX, GY2 + 20 + Math.sin(tick*0.19+5)*0.8);
      const sang = tick * 0.18;
      [[-11,4],[11,4]].forEach(([wx,wy]) => {
        cx.fillStyle='#111'; cx.beginPath(); cx.arc(wx,wy,6,0,Math.PI*2); cx.fill();
        cx.fillStyle='#555'; cx.beginPath(); cx.arc(wx,wy,2,0,Math.PI*2); cx.fill();
        cx.strokeStyle='#444'; cx.lineWidth=1;
        for(let a=0;a<4;a++){
          const ra=sang+a*Math.PI/2;
          cx.beginPath(); cx.moveTo(wx+Math.cos(ra)*5,wy+Math.sin(ra)*5); cx.lineTo(wx-Math.cos(ra)*5,wy-Math.sin(ra)*5); cx.stroke();
        }
      });
      cx.fillStyle='#1565c0'; cx.beginPath(); rr(cx,-13,-8,26,12,4); cx.fill();
      cx.fillStyle='#1e88e5'; cx.beginPath(); rr(cx,6,-14,8,8,3); cx.fill();
      cx.strokeStyle='#666'; cx.lineWidth=2; cx.lineCap='round';
      cx.beginPath(); cx.moveTo(10,-8); cx.lineTo(14,-13); cx.stroke();
      cx.beginPath(); cx.moveTo(14,-13); cx.lineTo(17,-11); cx.stroke();
      cx.fillStyle='#fffde7'; cx.beginPath(); cx.arc(15,-4,2.5,0,Math.PI*2); cx.fill();
      cx.fillStyle='#0d47a1'; cx.fillRect(-12,2,24,3);
      cx.fillStyle='#6a1b9a'; cx.beginPath(); rr(cx,-6,-22,10,14,3); cx.fill();
      cx.strokeStyle='#6a1b9a'; cx.lineWidth=2.5; cx.lineCap='round';
      cx.beginPath(); cx.moveTo(0,-18); cx.lineTo(13,-13); cx.stroke();
      cx.fillStyle='#7b1fa2'; cx.beginPath(); cx.arc(-1,-27,5.5,0,Math.PI*2); cx.fill();
      cx.beginPath(); cx.arc(-1,-27,5.5,Math.PI,Math.PI*2); cx.fill();
      cx.fillStyle='rgba(180,230,255,0.55)';
      cx.beginPath(); cx.moveTo(-5,-25); cx.quadraticCurveTo(-1,-22,3,-25); cx.fill();
      cx.restore();

      // ── PLAYER CAR — always centred on top, fastest ──
      drawCar(cx, CW/2 - 10, GY2 + 14 + bob, true, true);
    }

    // ════════════════════════════════════════════════════════
    // SCENE 3: Arrive at bungalow, park, exit, enter
    // ════════════════════════════════════════════════════════
    const GY3=138;
    let s3Phase='DRIVE_IN'; // DRIVE_IN → PARK_STOP → EXIT_CAR → WALK_IN → DONE
    let s3Tick=0;
    let s3CarX=-80;
    let s3PersonX=0, s3LegT=0;
    let s3DoorOpen=false;
    const BUNG_DOOR_CX=232; // centre of bungalow door

    function drawBungalow(dOpen){
      const bx=155, bw=160, bh=90;
      const gh=GY3;
      // Garden / grass
      cx.fillStyle='#060d06'; cx.fillRect(bx-30,gh,bw+60,CH-gh);
      // Driveway
      cx.fillStyle='#1a1a1a'; cx.fillRect(bx+bw/2-22,gh,44,CH-gh);
      cx.fillStyle='rgba(255,255,255,0.08)'; cx.fillRect(bx+bw/2-2,gh,4,CH-gh);

      // ── Left wing ──
      cx.fillStyle='#5a2510'; cx.fillRect(bx-22,gh-32,30,32);
      cx.fillStyle='#3a1008';
      cx.beginPath(); cx.moveTo(bx-26,gh-32); cx.lineTo(bx+4,gh-54); cx.lineTo(bx+12,gh-32); cx.closePath(); cx.fill();
      cx.fillStyle='#ffe082'; cx.fillRect(bx-16,gh-24,14,10); // lit window
      cx.strokeStyle='#c8a000'; cx.lineWidth=0.8; cx.strokeRect(bx-16,gh-24,14,10);
      cx.beginPath(); cx.moveTo(bx-9,gh-24); cx.lineTo(bx-9,gh-14); cx.stroke();

      // ── Main body ──
      cx.fillStyle='#6b2d14'; cx.fillRect(bx,gh-bh,bw,bh);
      // Stone texture lines
      cx.strokeStyle='rgba(0,0,0,0.15)'; cx.lineWidth=0.6;
      for(let hy=gh-bh+10;hy<gh;hy+=12){ cx.beginPath(); cx.moveTo(bx,hy); cx.lineTo(bx+bw,hy); cx.stroke(); }

      // ── Main roof ──
      cx.fillStyle='#2d0d04';
      cx.beginPath(); cx.moveTo(bx-14,gh-bh); cx.lineTo(bx+bw/2,gh-bh-42); cx.lineTo(bx+bw+14,gh-bh); cx.closePath(); cx.fill();
      // Roof ridge
      cx.strokeStyle='#1a0802'; cx.lineWidth=2;
      cx.beginPath(); cx.moveTo(bx-14,gh-bh); cx.lineTo(bx+bw/2,gh-bh-42); cx.lineTo(bx+bw+14,gh-bh); cx.stroke();

      // ── Right wing ──
      cx.fillStyle='#5a2510'; cx.fillRect(bx+bw-8,gh-36,30,36);
      cx.fillStyle='#3a1008';
      cx.beginPath(); cx.moveTo(bx+bw-12,gh-36); cx.lineTo(bx+bw+8,gh-56); cx.lineTo(bx+bw+26,gh-36); cx.closePath(); cx.fill();
      cx.fillStyle='#ffe082'; cx.fillRect(bx+bw-2,gh-28,12,9);
      cx.strokeStyle='#c8a000'; cx.lineWidth=0.8; cx.strokeRect(bx+bw-2,gh-28,12,9);

      // ── Chimneys ──
      [bx+bw-18, bx+26].forEach(cx2=>{
        cx.fillStyle='#1e0802'; cx.fillRect(cx2,gh-bh-52,9,22);
        // Smoke puffs
        for(let p=0;p<3;p++){
          const pha=(tick*0.03+p*0.9)%1;
          cx.globalAlpha=0.35*(1-pha);
          cx.fillStyle='#bbb';
          cx.beginPath(); cx.arc(cx2+4,gh-bh-52-pha*30+Math.sin(pha*5+p)*5,3+pha*5,0,Math.PI*2); cx.fill();
        }
        cx.globalAlpha=1;
      });

      // ── Pillars ──
      [bx+10,bx+bw-14].forEach(px2=>{
        cx.fillStyle='#c4a882'; cx.fillRect(px2,gh-bh+5,8,bh-5);
        cx.fillStyle='#d4b892'; cx.fillRect(px2+1,gh-bh+5,3,bh-5);
      });

      // ── Bay window (large, lit warm) ──
      cx.fillStyle='#ffe082'; cx.fillRect(bx+30,gh-64,28,20);
      cx.strokeStyle='#c8a000'; cx.lineWidth=1; cx.strokeRect(bx+30,gh-64,28,20);
      cx.lineWidth=0.7;
      cx.beginPath(); cx.moveTo(bx+44,gh-64); cx.lineTo(bx+44,gh-44); cx.stroke();
      cx.beginPath(); cx.moveTo(bx+30,gh-54); cx.lineTo(bx+58,gh-54); cx.stroke();
      // Warm glow
      cx.fillStyle='rgba(255,220,100,0.08)'; cx.fillRect(bx+28,gh-66,32,24);

      // ── Right window ──
      cx.fillStyle='#ffe082'; cx.fillRect(bx+bw-32,gh-60,22,14);
      cx.strokeStyle='#c8a000'; cx.lineWidth=1; cx.strokeRect(bx+bw-32,gh-60,22,14);
      cx.lineWidth=0.7;
      cx.beginPath(); cx.moveTo(bx+bw-21,gh-60); cx.lineTo(bx+bw-21,gh-46); cx.stroke();

      // ── Main door (arch) ──
      const DOOR_W=22, DOOR_H=30;
      const dx=bx+bw/2-DOOR_W/2;
      if(dOpen){
        cx.fillStyle='#0a0400'; cx.fillRect(dx,gh-DOOR_H,DOOR_W,DOOR_H);
        cx.beginPath(); cx.arc(bx+bw/2,gh-DOOR_H,DOOR_W/2,Math.PI,0); cx.fill();
        // Interior warm light spill
        cx.fillStyle='rgba(255,200,80,0.18)';
        cx.beginPath(); cx.moveTo(bx+bw/2,gh-DOOR_H); cx.lineTo(bx+bw/2-30,gh); cx.lineTo(bx+bw/2+30,gh); cx.closePath(); cx.fill();
      } else {
        cx.fillStyle='#4a1e08'; cx.fillRect(dx,gh-DOOR_H,DOOR_W,DOOR_H);
        cx.beginPath(); cx.arc(bx+bw/2,gh-DOOR_H,DOOR_W/2,Math.PI,0); cx.fill();
        cx.strokeStyle='rgba(0,0,0,0.3)'; cx.lineWidth=0.8;
        cx.beginPath(); cx.moveTo(bx+bw/2,gh-DOOR_H); cx.lineTo(bx+bw/2,gh); cx.stroke();
        cx.fillStyle='#c8a000'; cx.beginPath(); cx.arc(bx+bw/2+6,gh-DOOR_H/2,1.8,0,Math.PI*2); cx.fill();
      }

      // ── Porch steps ──
      cx.fillStyle='#9e7048';
      cx.fillRect(bx+bw/2-14,gh-5,28,6); cx.fillRect(bx+bw/2-10,gh-2,20,4);

      // ── Garden hedges & path lights ──
      [[bx-2,gh-10,14,10],[bx+bw-12,gh-10,14,10]].forEach(([hx,hy,hw,hh])=>{
        cx.fillStyle='#051505'; cx.fillRect(hx,hy,hw,hh);
        cx.fillStyle='#071f07'; cx.fillRect(hx+1,hy-3,hw-2,4);
      });
      // Path lights
      [bx+bw/2-18,bx+bw/2+18].forEach(plx=>{
        cx.fillStyle='#333'; cx.fillRect(plx,gh-10,2,10);
        cx.fillStyle='rgba(255,240,100,0.6)'; cx.beginPath(); cx.arc(plx+1,gh-10,4,0,Math.PI*2); cx.fill();
      });
    }

    function scene3(){
      
      drawNightSky(GY3);
      // Ground
      cx.fillStyle='#060c06'; cx.fillRect(0,GY3,CW,CH-GY3);
      cx.fillStyle='#141414'; cx.fillRect(0,GY3+4,CW,20);
      cx.fillStyle='rgba(255,255,255,0.25)';
      for(let rx=0;rx<CW;rx+=50){ cx.fillRect(rx,GY3+12,30,2); }

      const DURS={DRIVE_IN:90,PARK_STOP:35,EXIT_CAR:55,WALK_IN:70,DONE:60};

      drawBungalow(s3DoorOpen);

      if(s3Phase==='DRIVE_IN'){
        const t=Math.min(s3Tick/DURS.DRIVE_IN,1);
        const ease=1-Math.pow(1-t,3);
        s3CarX=-80+(-80+(BUNG_DOOR_CX-30)-(-80))*ease;
        drawCar(cx,s3CarX,GY3+10,true,s3Tick<DURS.DRIVE_IN-5);
        if(s3Tick>=DURS.DRIVE_IN){ s3Phase='PARK_STOP'; s3Tick=0; }

      } else if(s3Phase==='PARK_STOP'){
        drawCar(cx,BUNG_DOOR_CX-30,GY3+10,true,false);
        if(s3Tick>=DURS.PARK_STOP){ s3Phase='EXIT_CAR'; s3Tick=0; s3PersonX=BUNG_DOOR_CX-48; }

      } else if(s3Phase==='EXIT_CAR'){
        drawCar(cx,BUNG_DOOR_CX-30,GY3+10,s3Tick<15,false);
        const sc=Math.min(s3Tick/DURS.EXIT_CAR,1);
        drawPerson(s3PersonX,GY3-18,sc,0,false,false);
        if(s3Tick>=DURS.EXIT_CAR){ s3Phase='WALK_IN'; s3Tick=0; }

      } else if(s3Phase==='WALK_IN'){
        s3DoorOpen=true;
        drawCar(cx,BUNG_DOOR_CX-30,GY3+10,false,false);
        const t=Math.min(s3Tick/DURS.WALK_IN,1);
        s3LegT+=0.22;
        const wx=s3PersonX+(BUNG_DOOR_CX-s3PersonX)*t;
        const sc=1-t*0.85;
        drawPerson(wx,GY3-18,sc,s3LegT,true,false);
        if(s3Tick>=DURS.WALK_IN){ s3Phase='DONE'; s3Tick=0; }

      } else if(s3Phase==='DONE'){
        s3DoorOpen=false;
        drawCar(cx,BUNG_DOOR_CX-30,GY3+10,false,false);
        if(s3Tick>=DURS.DONE){
          // Full restart from Scene 1
          tick=0; s1Phase='LIFT'; s1Tick=0; s1PersonX=42;
          s2Scroll=0;
          s3Phase='DRIVE_IN'; s3Tick=0; s3CarX=-80; s3PersonX=BUNG_DOOR_CX-48; s3LegT=0; s3DoorOpen=false;
        }
      }
      s3Tick++;
    }

    // ── Main loop ─────────────────────────────────────────────
    function frame(){
      cx.clearRect(0,0,CW,CH);
      if(tick < S1_END)       scene1();
      else if(tick < S2_END)  scene2();
      else if(tick < S3_END)  scene3();
      else { tick=0; s1Phase='LIFT'; s1Tick=0; s1PersonX=42; s2Scroll=0; s3Phase='DRIVE_IN'; s3Tick=0; s3CarX=-80; s3DoorOpen=false; }
      tick++;
      animRAF=requestAnimationFrame(frame);
    }

    frame();

  } else if (!isDone && existingOverlay) {
    existingOverlay.remove();
  }

  // ── Render cards ──
  const dayClass = isDone ? `${policy.label}${hasOT ? ' +' + otVal + 'h OT' : ''} ✅` : 'In Progress';
  cardsEl.innerHTML = `

    <!-- Row 1: Login / Go Home / Day Status -->
    <div class="card blue">
      <div class="card-label">🕐 Login Time</div>
      <div class="card-value">${fmtTime(loginTime)}</div>
      <div class="card-sub">First punch-in</div>
    </div>

    <div class="card ${isDone ? 'green done' : 'orange'}">
      <div class="card-label">🏠 Go Home Time</div>
      <div class="card-value">${fmtTime(finalGoHome)}</div>
      <div class="card-sub">${targetLogoutTs ? 'Based on target logout' : hasOT ? 'Login + ' + otVal + 'h OT + breaks' : extraBreak > 0 ? '+' + fmtDuration(extraBreak) + ' extra break' : 'Policy based'}</div>
    </div>

    <div class="card purple">
      <div class="card-label">📅 Day Status</div>
      <div class="card-value" style="font-size:13px;">${dayClass}</div>
      <div class="card-sub">${policy.label}${hasOT ? ' + ' + otVal + 'h OT' : ''}</div>
    </div>

    <!-- Row 2: In-Time -->
    <div class="card green">
      <div class="card-label">✅ In-Time Completed</div>
      <div class="card-value">${fmtDuration(inTimeMs)}</div>
      <div class="card-sub">of ${fmtDuration(effectiveInTime)} required${hasOT ? ' (incl. ' + otVal + 'h OT)' : ''}</div>
    </div>

    <div class="card ${remainInMs === 0 ? 'green done' : 'red'}">
      <div class="card-label">⏳ In-Time Left</div>
      <div class="card-value">${remainInMs === 0 ? '0:00:00 ✓' : fmtDuration(remainInMs)}</div>
      <div class="card-sub">Seated time remaining</div>
    </div>

    <div class="card teal">
      <div class="card-label">🏢 Total Time Completed</div>
      <div class="card-value">${fmtDuration(totalOfficeMs)}</div>
      <div class="card-sub">of ${fmtDuration(policy.total)} required</div>
    </div>

    <!-- Row 3: Breaks -->
    <div class="card orange">
      <div class="card-label">☕ Break Taken</div>
      <div class="card-value">${fmtDuration(totalBreakMs)}</div>
      <div class="card-sub">${currentlyOnBreak ? '🔴 On break now · started ' + fmtTime(lastEntry.ts) : hasOT ? 'No min break during OT' : 'Min ' + fmtDuration(effectiveMinBreak) + ' required'}</div>
    </div>

    <div class="card ${hasOT ? 'orange' : availableBreakMs > policy.minBreak ? 'teal' : 'blue'}">
      <div class="card-label">🎯 Total Break Available</div>
      <div class="card-value">${fmtDuration(availableBreakMs)}</div>
      <div class="card-sub">${hasOT && targetLogoutTs ? 'Target − Login − ' + otVal + 'h OT' : hasOT ? 'Breaks extend go home time' : availableBreakMs > policy.minBreak ? 'Early arrival bonus!' : 'Policy minimum'}</div>
    </div>

    <div class="card ${hasOT && !targetLogoutTs ? 'blue' : remainingBreakMs < 0 ? 'red overdue' : 'green'}">
      <div class="card-label">🟢 Remaining Break</div>
      <div class="card-value">${hasOT && !targetLogoutTs ? '--' : fmtDuration(remainingBreakMs)}</div>
      <div class="card-sub">${hasOT && !targetLogoutTs ? 'Set target logout to track' : remainingBreakMs < 0 ? 'Break exceeded!' : 'Break left to take'}</div>
    </div>

    <!-- Row 4: Total time remaining -->
    <div class="card ${remainTotalMs === 0 ? 'green done' : 'purple'}" style="grid-column:1/-1;display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
      <div style="flex:1;min-width:120px;">
        <div class="card-label">⏱ Total Office Time Remaining</div>
        <div class="card-value" style="font-size:20px;">${remainTotalMs === 0 ? '0:00:00 ✓' : fmtDuration(remainTotalMs)}</div>
        <div class="card-sub">${targetLogoutTs ? 'Until target logout' : hasOT ? 'Until ' + fmtTime(finalGoHome) : 'Including breaks (' + fmtDuration(policy.total) + ' target)'}</div>
      </div>
      ${targetLogoutTs ? `
      <div style="flex:1;min-width:120px;border-left:1px solid #e8eaf6;padding-left:18px;">
        <div class="card-label">🎯 Target Logout</div>
        <div class="card-value" style="font-size:20px;">${fmtTime(targetLogoutTs)}</div>
        <div class="card-sub">${!hasOT && remainingBreakMs >= 0 ? fmtDuration(remainingBreakMs) + ' break still available' : ''}</div>
      </div>` : `
      <div style="flex:1;min-width:120px;border-left:1px solid #e8eaf6;padding-left:18px;">
        <div class="card-label">🏠 Go Home Time</div>
        <div class="card-value" style="font-size:20px;">${fmtTime(finalGoHome)}</div>
        <div class="card-sub">${hasOT ? 'OT + breaks included' : extraBreak > 0 ? '+' + fmtDuration(extraBreak) + ' extra break' : 'Policy based'}</div>
      </div>`}
    </div>
  `;
}

// ── Load from storage ─────────────────────────────────────────────────────
localGet(['logs', 'target', 'dayType', 'otHours', 'mycpePunches', 'mycpeAttendance'], r => {
  let loaded = false;

  // Try structured punches from MYCPE (new format - each punch is its own entry)
  if (r.mycpePunches) {
    try {
      const punches = JSON.parse(r.mycpePunches);
      if (punches.length) {
        const lines = [];
        punches.forEach(p => {
          // New format: { date, time, type }
          if (p.time && p.type) {
            lines.push(`${p.date}\t${p.time}\t${p.type}`);
          }
          // Old format: { date, startTime, endTime }
          else if (p.startTime) {
            lines.push(`${p.date}\t${p.startTime}\tIN`);
            if (p.endTime) lines.push(`${p.date}\t${p.endTime}\tOUT`);
          }
        });
        if (lines.length) {
          logsEl.value = lines.join('\n');
          loaded = true;
          setStatus('Auto-loaded from MYCPE', 'green');
        }
      }
    } catch (e) {}
  }

  // Try legacy mycpeAttendance
  if (!loaded && r.mycpeAttendance) {
    try {
      const arr = JSON.parse(r.mycpeAttendance);
      if (arr && arr.length) {
        logsEl.value = arr.map(x => `${x.date}\t${x.time}\t${x.type}`).join('\n');
        loaded = true;
        setStatus('Auto-loaded from MYCPE (legacy)', 'green');
      }
    } catch (e) {}
  }

  // Fall back to manually saved logs
  if (!loaded && r.logs) {
    logsEl.value = r.logs;
    setStatus('Using saved manual log', 'yellow');
  }

  if (!loaded && !r.logs) {
    setStatus('Open MYCPE attendance page to auto-load', 'red');
  }

  if (r.target) targetEl.value = r.target;
  if (r.dayType && dayTypeEl) dayTypeEl.value = r.dayType;
  if (r.otHours && otHoursEl) otHoursEl.value = r.otHours;

  calculate();
});

// ── Event Listeners ────────────────────────────────────────────────────────
logsEl.addEventListener('input', () => {
  localSet({ logs: logsEl.value });
  calculate();
});

targetEl.addEventListener('input', () => {
  localSet({ target: targetEl.value });
  calculate();
});

dayTypeEl.addEventListener('change', () => {
  localSet({ dayType: dayTypeEl.value });
  calculate();
});

if (otHoursEl) {
  otHoursEl.addEventListener('input', () => {
    localSet({ otHours: otHoursEl.value });
    calculate();
  });
}

document.getElementById('clearOT').addEventListener('click', () => {
  if (otHoursEl) otHoursEl.value = '';
  localRemove('otHours');
  calculate();
});

document.getElementById('clearTarget').addEventListener('click', () => {
  targetEl.value = '';
  localRemove('target');
  calculate();
});

document.getElementById('refreshBtn').addEventListener('click', () => {
  setStatus('Refreshing from MYCPE...', 'yellow');
  localGet(['mycpePunches', 'mycpeAttendance'], r => {
    let loaded = false;
    if (r.mycpePunches) {
      try {
        const punches = JSON.parse(r.mycpePunches);
        if (punches.length) {
          const lines = [];
          punches.forEach(p => {
            if (p.time && p.type) {
              lines.push(`${p.date}\t${p.time}\t${p.type}`);
            } else if (p.startTime) {
              lines.push(`${p.date}\t${p.startTime}\tIN`);
              if (p.endTime) lines.push(`${p.date}\t${p.endTime}\tOUT`);
            }
          });
          if (lines.length) {
            logsEl.value = lines.join('\n');
            loaded = true;
            setStatus('Refreshed from MYCPE ✓', 'green');
          }
        }
      } catch (e) {}
    }
    if (!loaded && r.mycpeAttendance) {
      try {
        const arr = JSON.parse(r.mycpeAttendance);
        if (arr && arr.length) {
          logsEl.value = arr.map(x => `${x.date}\t${x.time}\t${x.type}`).join('\n');
          loaded = true;
          setStatus('Refreshed from MYCPE (legacy) ✓', 'green');
        }
      } catch (e) {}
    }
    if (!loaded) setStatus('No MYCPE data found – open the attendance page first', 'red');
    calculate();
  });
});

document.getElementById('clearBtn').addEventListener('click', () => {
  localStorage.clear();
  logsEl.value = '';
  targetEl.value = '';
  if (dayTypeEl) dayTypeEl.value = 'FULL';
  if (otHoursEl) otHoursEl.value = '';
  cardsEl.innerHTML = `<div class='card-placeholder'>Enter punch data to see calculations</div>`;
  setStatus('All data cleared', 'red');
});

// ── Auto-update when content script writes new punch data ─────────────────
storageOnChanged((changes, area) => {
  if (area !== 'local') return;
  if (!changes.mycpePunches) return;

  try {
    const punches = JSON.parse(changes.mycpePunches.newValue || '[]');
    if (!punches.length) return;

    const lines = [];
    punches.forEach(p => {
      if (p.time && p.type) {
        lines.push(`${p.date}\t${p.time}\t${p.type}`);
      } else if (p.startTime) {
        lines.push(`${p.date}\t${p.startTime}\tIN`);
        if (p.endTime) lines.push(`${p.date}\t${p.endTime}\tOUT`);
      }
    });
    if (lines.length) {
      logsEl.value = lines.join('\n');
      localSet({ logs: logsEl.value });
      setStatus('Auto-updated from MYCPE ✓', 'green');
      calculate();
    }
  } catch (e) {}
});

// ── Live clock + recalc every second ──────────────────────────────────────
setInterval(() => {
  clockEl.textContent = new Date().toLocaleTimeString('en-IN', {
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
  });
  updateGreeting();
  calculate();
}, 1000);

</script>
</body>
</html>
